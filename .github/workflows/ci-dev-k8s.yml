name: "[K8S] Build and push nor-reward-distribution-bot to dev"

run-name: "[K8S] Build and push nor-reward-distribution-bot:dev to dev"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/**'
      - 'tests/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@8d22c57b310ff5ebc27b8883bb4d0048e39c6430  # main
    with:
      target: dev
      harbor_project: team-staking-core
      image: nor-reward-distribution-bot
    secrets: inherit
